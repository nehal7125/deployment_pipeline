name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2 Ubuntu
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            cd ${{ secrets.EC2_PROJECT_PATH }}
            git config --global credential.helper store
            echo "https://${{ secrets.GIT_USERNAME }}:${{ secrets.GIT_TOKEN }}@github.com" > ~/.git-credentials
            chmod 600 ~/.git-credentials
            REPO_URL="https://${{ secrets.GIT_USERNAME }}:${{ secrets.GIT_TOKEN }}@github.com/${{ github.repository }}.git"
            if [ ! -d .git ]; then
              if [ -z "$(ls -A)" ]; then
                cd ..
                rm -rf $(basename ${{ secrets.EC2_PROJECT_PATH }})
                git clone $REPO_URL $(basename ${{ secrets.EC2_PROJECT_PATH }})
                cd $(basename ${{ secrets.EC2_PROJECT_PATH }})
              else
                # Directory has files but is not a git repo, initialize it
                git init
                git remote add origin $REPO_URL
                git fetch origin
                git branch -M main
                git reset --hard origin/main
              fi
            else
              if ! git remote | grep -q "^origin$"; then
                git remote add origin $REPO_URL
              else
                git remote set-url origin $REPO_URL
              fi
              git fetch origin
              git stash || true
              git clean -fd || true
              git branch --show-current
              git reset --hard origin/main
            fi
            sudo npm i
            mkdir -p logs
            pm2 stop my-react-dev || pm2 stop 0 || pm2 stop ${{ secrets.PM2_APP_ID }} || true
            pm2 delete my-react-dev || pm2 delete 0 || pm2 delete ${{ secrets.PM2_APP_ID }} || true
            pm2 start ecosystem.config.cjs
            pm2 save

